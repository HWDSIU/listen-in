name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm-anthropic,dev]"
      - run: ruff check src tests examples
      - run: mypy src

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Whisper is faked in the tests; numpy is enough. No live radio, weights or paid APIs.
      - run: pip install -e ".[llm-anthropic,dev]" numpy certifi
      - run: pytest --cov=listen_in --cov-report=term-missing

  test-base-install:
    name: base install (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Import works without Whisper, Anthropic or ffmpeg
        run: |
          python - <<'EOF'
          import sys, listen_in
          for mod in ("whisper", "torch", "anthropic", "numpy"):
              assert mod not in sys.modules, mod
          print("listen_in", listen_in.__version__, "imports cleanly")
          EOF
      - run: pytest

  test-whisper-extra:
    name: whisper extra (no weight download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU-only torch, then the whisper extra
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[whisper,dev]"
      - name: Whisper imports; no model is loaded
        run: |
          python - <<'EOF'
          import whisper, listen_in.transcription as t
          assert "small" in whisper.available_models()
          assert t._MODELS == {}
          print("openai-whisper import OK")
          EOF
      - run: pytest tests/test_transcription.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel installs in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import listen_in; print(listen_in.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
